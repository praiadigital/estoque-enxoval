<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estoque Enxoval — Calculadora | Praia Digital</title><meta name="description" content="Quantos jogos de cama e banho seu imóvel de temporada precisa? Calcule por capacidade, giro e lavanderia."><style>*{box-sizing:border-box;margin:0;font-family:system-ui,sans-serif}body{background:linear-gradient(160deg,#f2eef9,#f7f3ea);padding:1rem;color:#123}.card{max-width:640px;margin:auto;background:#fff;border-radius:18px;padding:1.6rem;box-shadow:0 8px 30px #5e4b8b22}h1{color:#4d3d78;font-size:1.5rem}label{display:block;margin-top:1rem;font-weight:600;font-size:.9rem}input,select{width:100%;padding:.6rem;border:2px solid #e0d9ef;border-radius:10px;font-size:1rem}button{margin-top:1.4rem;width:100%;padding:.9rem;background:#5e4b8b;color:#fff;border:0;border-radius:12px;font-size:1.05rem;font-weight:700;cursor:pointer}#res{margin-top:1.4rem;display:none;background:#f0ecf8;border-radius:12px;padding:1rem}table{width:100%;border-collapse:collapse;font-size:.92rem;margin-top:.6rem}td,th{padding:.4rem;border-bottom:1px solid #e5dff2;text-align:left}nav{max-width:640px;margin:1rem auto;font-size:.85rem;text-align:center}nav a{color:#5e4b8b;margin:0 .5rem;text-decoration:none}</style></head><body><nav><a href="https://praia.digital">🌊 Praia Digital</a> · <a href="https://praia.digital/turnover-pro">Turnover Pro</a> · <a href="https://praia.digital/decor-praia">Decor Praia</a> · <a href="https://praia.digital/checklist-vistoria">Checklist Vistoria</a></nav><div class="card"><h1>🛏️ Estoque Enxoval</h1><p>Nem falte, nem sobre. O enxoval exato para o seu giro.</p><label>Capacidade máxima (hóspedes)</label><input id="h" type="number" value="6"><label>Camas de casal</label><input id="cc" type="number" value="2"><label>Camas de solteiro</label><input id="cs" type="number" value="2"><label>Giro (trocas de hóspede/semana)</label><input id="g" type="number" value="2"><label>Lavanderia devolve em</label><select id="l"><option value="1" selected>24h (rápida)</option><option value="2">48h+</option></select><button onclick="calc()">Calcular enxoval</button><div id="res"></div></div><script>function calc(){const g=id=>+document.getElementById(id).value;const h=g('h'),cc=g('cc'),cs=g('cs'),giro=g('g'),l=g('l');const sets=Math.min(4,Math.ceil(giro*l/2)+1);const jc=cc*sets,js=cs*sets,tb=h*sets,tr=h*sets;const custo=jc*120+js*90+tb*35+tr*18;document.getElementById('res').style.display='block';document.getElementById('res').innerHTML=`<p>Rotações necessárias: <b>${sets} jogos completos</b></p><table><tr><th>Item</th><th>Quantidade</th></tr><tr><td>Jogos de cama casal</td><td>${jc}</td></tr><tr><td>Jogos de cama solteiro</td><td>${js}</td></tr><tr><td>Toalhas de banho</td><td>${tb}</td></tr><tr><td>Toalhas de rosto</td><td>${tr}</td></tr></table><p>💰 Investimento estimado: <b>R$ ${custo.toLocaleString('pt-BR')}</b> (reposição de ~30%/ano por desgaste)</p><p>💡 O enxoval impacta direto o tempo de turnover — valide no <a href="https://praia.digital/turnover-pro">Turnover Pro</a>.</p>`}</script></body></html>
